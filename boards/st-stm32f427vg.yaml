version: 0.3.0
targets:
  st-stm32f427vg:
    chip: stm32f427vg
    ariel:
      swi: USART1
    # Local Ariel OS board extension.
    # The wrapper script `scripts/generate-ariel-boards.ps1` strips this block
    # before calling upstream `sbd-gen`, then injects the modem metadata back
    # into the generated board support crate.
    modem:
      model: EC800M
      uart: USART3
      baudrate: 921600
      uart_dma: true
      rx_pin: PD9
      tx_pin: PD8
      power:
        pin: PD15
        active: low
      pwrkey:
        pin: PD13
        active: low
        pulse_ms: 1000
    tbox_log:
      kernel:
        tag: kernel
        enabled: true
      modem:
        tag: modem
        enabled: false
      can:
        tag: can
        enabled: true
    can:
      peripheral: CAN2
      master_peripheral: CAN1
      rx_pin: PB12
      tx_pin: PB13
      phy: TJA1042
      standby_pin: PB4
      standby_normal_level: low
      bitrate: 250000
      sample_point_permille: 889
      filter_split_index: 13
      filter_bank_index: 13
      test_id: 0x123
      loopback_test_id: 0x321
      loopback_timeout_ms: 300
    uarts:
      modem:
        rx_pin: PD9
        tx_pin: PD8
        possible_peripherals:
          - USART3
    leds:
      led0:
        pin: PE9
        color: green
        active: high
    buttons:
      button0:
        pin: PC13
